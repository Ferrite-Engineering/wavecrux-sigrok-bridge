name: release

# Build per-OS+arch release archives and upload them to a GitHub
# Release on tag push.
#
# The release archive contains:
#   - libwavecrux_sigrok_bridge_shim.{so,dylib,dll}  (the shim)
#   - wavecrux-sigrok-bridge[.exe]              (the subprocess)
#   - README.md, LICENSE, INSTALL.md
#   - SHA256SUMS
#
# Backend per target:
#   - linux (x86_64) and macOS (x86_64, arm64) ship the REAL
#     `--features sigrok` backend: the bridge links libsigrokdecode and
#     the Python decoder corpus dynamically, so the end user installs the
#     runtime (`apt install libsigrokdecode4` / `brew install
#     libsigrokdecode`) per docs/INSTALL.md — the archive is not
#     self-contained.
#   - windows ships the MOCK backend for now (no apt/Homebrew source for
#     libsigrokdecode on Windows; the DLL-bundling story is unresolved).
#     See the `sigrok: false` matrix entry and docs/INSTALL.md.
#
# Tag scheme: v-MAJOR.MINOR.PATCH (matches Cargo.toml).

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.target.os }} ${{ matrix.target.arch }})
    runs-on: ${{ matrix.target.runner }}
    # Cost guardrail: no job may run unbounded (max observed suite-wide is 29 min).
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # `sigrok: true` builds the real libsigrokdecode backend on a
        # Linux x86_64 runner that builds the GPL toolchain
        # (libsigrokdecode + Python + libclang). Windows stays on the
        # mock backend (`sigrok: false`). Rive has no Linux/Windows ARM
        # runtime, so WaveCrux ships no Linux/Windows ARM build and the
        # bridge follows suit — macOS ARM (Apple Silicon) is unaffected.
        target:
          - { os: linux,   arch: x86_64,  runner: ubuntu-latest,    triple: x86_64-unknown-linux-gnu,  sigrok: true }
          - { os: macos,   arch: x86_64,  runner: macos-15-intel,         triple: x86_64-apple-darwin,        sigrok: true }
          - { os: macos,   arch: arm64,   runner: macos-14,         triple: aarch64-apple-darwin,       sigrok: true }
          - { os: windows, arch: x86_64,  runner: windows-latest,   triple: x86_64-pc-windows-msvc,     sigrok: false }
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target.triple }}

      - name: Install SigRok build deps (Linux)
        if: matrix.target.os == 'linux' && matrix.target.sigrok
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libsigrokdecode4 libsigrokdecode-dev python3-dev \
            pkg-config clang libclang-dev

      - name: Install SigRok build deps (macOS)
        if: matrix.target.os == 'macos' && matrix.target.sigrok
        run: |
          brew update
          brew install pkg-config libsigrokdecode

      - name: Build shim + bridge (release)
        run: cargo build --release --workspace --target ${{ matrix.target.triple }} ${{ matrix.target.sigrok && '--features sigrok' || '' }}

      - name: Verify license isolation (POSIX)
        if: matrix.target.os != 'windows'
        run: bash tool/verify_isolation.sh target/${{ matrix.target.triple }}/release/libwavecrux_sigrok_bridge_shim${{ matrix.target.os == 'macos' && '.dylib' || '.so' }}

      # ── macOS: Developer ID sign + notarize ──────────────────────────────
      # Imports the Developer ID Application identity into a throwaway keychain.
      # Mirrors the four product repos' release-desktop.yml, including the
      # no-op: with no cert secret the next step falls back to ad-hoc signing,
      # which is what this workflow did before and is still correct for a
      # fork or a secretless run.
      - name: Set up macOS signing
        id: macsign
        if: matrix.target.os == 'macos'
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${MACOS_CERT_P12_BASE64:-}" ]]; then
            echo "No MACOS_CERT_P12_BASE64 — macOS binaries stay ad-hoc signed."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          KC="$RUNNER_TEMP/build.keychain-db"
          KC_PW="$(openssl rand -base64 24)"
          echo "$MACOS_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/devid.p12"
          security create-keychain -p "$KC_PW" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p "$KC_PW" "$KC"
          security import "$RUNNER_TEMP/devid.p12" -k "$KC" -P "${MACOS_CERT_PASSWORD:-}" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KC_PW" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | sed 's/"//g')
          rm -f "$RUNNER_TEMP/devid.p12"
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Codesign macOS binaries
        if: matrix.target.os == 'macos'
        env:
          TEAM_ID: '7957R7M965'
        run: |
          set -euo pipefail
          dylib=target/${{ matrix.target.triple }}/release/libwavecrux_sigrok_bridge_shim.dylib
          exe=target/${{ matrix.target.triple }}/release/wavecrux-sigrok-bridge

          # Either way the binaries end up with a cryptographically valid
          # signature, which is what macOS's CS_EXEC_SET_KILL requires: an app
          # built with that flag (WaveCrux included) can only spawn children
          # that carry one. Ad-hoc satisfies the kernel but has no
          # Apple-registered identity, so Gatekeeper blocks it on a machine
          # that downloaded the archive — worse than the helper being absent.
          if [[ "${{ steps.macsign.outputs.enabled }}" == "true" ]]; then
            ID="$(security find-identity -v -p codesigning \
              | grep 'Developer ID Application' | grep "($TEAM_ID)" \
              | head -1 | awk '{print $2}')"
            if [[ -z "$ID" ]]; then
              echo "error: cert imported but no Developer ID Application for team $TEAM_ID" >&2
              exit 1
            fi
            # --options runtime is required for notarization; --timestamp so
            # the signature outlives the certificate.
            for f in "$dylib" "$exe"; do
              codesign --sign "$ID" --options runtime --timestamp --force "$f"
            done
          else
            for f in "$dylib" "$exe"; do
              codesign --sign - --force "$f"
            done
          fi
          codesign --verify --strict "$dylib"
          codesign --verify --strict "$exe"

      - name: Notarize macOS binaries
        if: matrix.target.os == 'macos' && steps.macsign.outputs.enabled == 'true'
        env:
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
          TEAM_ID: '7957R7M965'
        run: |
          set -euo pipefail
          # A SUBMISSION-ONLY zip. notarytool accepts .zip, .pkg and .dmg and
          # NOT .tar.gz, so the archive we ship cannot itself be submitted —
          # docs/RELEASING.md's snippet submits the .tar.gz and would fail.
          # What notarization actually registers with Apple is each binary's
          # code-directory hash, so notarizing a zip of these exact signed
          # files notarizes the files, whichever archive then carries them.
          # That keeps the published .tar.gz, its .sha256, README.md and
          # docs/INSTALL.md all unchanged.
          ditto -c -k --keepParent \
            target/${{ matrix.target.triple }}/release/wavecrux-sigrok-bridge \
            "$RUNNER_TEMP/notarize-exe.zip"
          ditto -c -k --keepParent \
            target/${{ matrix.target.triple }}/release/libwavecrux_sigrok_bridge_shim.dylib \
            "$RUNNER_TEMP/notarize-dylib.zip"
          for z in "$RUNNER_TEMP/notarize-exe.zip" "$RUNNER_TEMP/notarize-dylib.zip"; do
            xcrun notarytool submit "$z" \
              --apple-id "$NOTARY_APPLE_ID" \
              --password "$NOTARY_PASSWORD" \
              --team-id "$TEAM_ID" \
              --wait
          done
          # No `stapler staple`: a ticket can only be stapled to a .app, .pkg
          # or .dmg, never to a loose executable or a zip of one. Gatekeeper
          # resolves these online instead, which is why the binaries are
          # submitted rather than the archive.

      - name: Stage release artifacts
        shell: bash
        run: |
          set -euxo pipefail
          version="${GITHUB_REF_NAME#v}"
          tag="wavecrux-sigrok-bridge-${version}-${{ matrix.target.os }}-${{ matrix.target.arch }}"
          stage="$(mktemp -d)/${tag}"
          mkdir -p "$stage"
          cp README.md LICENSE NOTICES CONTRIBUTING.md "$stage/"
          cp -r docs "$stage/docs"
          if [[ "${{ matrix.target.os }}" == "windows" ]]; then
            cp target/${{ matrix.target.triple }}/release/wavecrux_sigrok_bridge_shim.dll "$stage/"
            cp target/${{ matrix.target.triple }}/release/wavecrux-sigrok-bridge.exe "$stage/"
            (cd "$(dirname "$stage")" && 7z a -tzip "${tag}.zip" "${tag}")
            mv "$(dirname "$stage")/${tag}.zip" .
            sha256sum "${tag}.zip" > "${tag}.zip.sha256"
          else
            ext="so"
            [[ "${{ matrix.target.os }}" == "macos" ]] && ext="dylib"
            cp target/${{ matrix.target.triple }}/release/libwavecrux_sigrok_bridge_shim.${ext} "$stage/"
            cp target/${{ matrix.target.triple }}/release/wavecrux-sigrok-bridge "$stage/"
            tar -czf "${tag}.tar.gz" -C "$(dirname "$stage")" "${tag}"
            shasum -a 256 "${tag}.tar.gz" > "${tag}.tar.gz.sha256"
          fi

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            wavecrux-sigrok-bridge-*.tar.gz
            wavecrux-sigrok-bridge-*.tar.gz.sha256
            wavecrux-sigrok-bridge-*.zip
            wavecrux-sigrok-bridge-*.zip.sha256
          generate_release_notes: true
